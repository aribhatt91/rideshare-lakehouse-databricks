resources:

  jobs:

    streaming_job:

      name: ride-sharing-streaming

      continuous:
        pause_status: PAUSED
        task_retry_mode: ON_FAILURE

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:

        - task_key: bronze_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline.id}