[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-sharing-data-platform"
version = "0.1.0"
description = "Production-style ride-sharing data platform built with Databricks"
requires-python = ">=3.11,<=3.13"

dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=18,<22",
    "boto3>=1.35,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["event_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"